<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080914">
  <meta name="description" content="Something new is on the horizon. Website coming soon.">
  <title>Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080914;
      --text: #f7f7ff;
      --muted: #a6a9c2;
      --accent: #9b8cff;
      --cyan: #58e6df;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 2rem;
      background:
        radial-gradient(ellipse at 18% 20%, rgba(104, 75, 255, .22), transparent 38%),
        radial-gradient(ellipse at 82% 78%, rgba(30, 220, 207, .14), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .orb {
      position: fixed;
      width:  min(48vw, 560px);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .22;
      pointer-events: none;
      animation: drift 14s ease-in-out infinite alternate;
    }

    .orb-one { top: -22%; left: -12%; background: #765cff; }
    .orb-two { right: -17%; bottom: -28%; background: #24d9ce; animation-delay: -7s; }

    .card {
      position: relative;
      width: min(100%, 760px);
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 4.5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
      box-shadow: 0 32px 100px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin: 0 0 1.6rem;
      color: #d4d1ff;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
      animation: pulse 2s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.3rem, 10vw, 6.8rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 800;
    }

    h1 span {
      display: block;
      padding-bottom: .08em;
      background: linear-gradient(100deg, #fff 12%, #c8c0ff 52%, #71eee3 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      max-width: 440px;
      margin: 1.7rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.12rem);
      line-height: 1.75;
    }

    .rule {
      width: 62px;
      height: 2px;
      margin: 2.4rem auto 0;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--cyan));
      box-shadow: 0 0 18px rgba(130, 227, 224, .55);
    }

    .footer {
      position: fixed;
      right: 1.5rem;
      bottom: 1.25rem;
      left: 1.5rem;
      color: rgba(210, 213, 235, .42);
      text-align: center;
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(22px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(35px, -25px, 0) scale(1.12); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.72); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>

  <main class="card">
    <p class="eyebrow"><span class="pulse" aria-hidden="true"></span> Something is in the works</p>
    <h1>Big things<span>are coming.</span></h1>
    <p class="subtitle">We're putting the finishing touches on something special. A fresh experience is on its way.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>

  <footer class="footer">Worth the wait · Coming soon</footer>
</body>
</html>
